name: CI

on:
  push:
    # Don't run CI on every commit on the main branch
    #branches:
    # - main
    # Only on tagged commits
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  schedule:
    # run every week (for --pre release tests)
    - cron: "0 0 * * 0"

# cancel in-progress runs that use the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Needed for pypi publishing only
  # check-manifest:
  #   # check-manifest is a tool that checks that all files in version control are
  #   # included in the sdist (unless explicitly excluded)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: pipx run check-manifest

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # matches linux-64 and osx-arm64 in pixi platforms
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs needs full history + tags to compute the version

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.75.0
          environments: dev
          cache: true
          # only needed if pull if from private prefix.dev channels:
          # auth-host: prefix.dev
          # auth-token: ${{ secrets.PREFIX_DEV_TOKEN }}

      - name: Install Playwright browsers
        run: pixi run -e dev playwright

      - name: Run tests with coverage
        run: pixi run -e dev pytest --color=yes --cov --cov-report=xml --cov-report=term-missing

      - name: Coverage summary
        # Get the summary on the action run's page (not accessible for badges)
        if: matrix.os == 'ubuntu-latest'
        run: pixi run -e dev coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
